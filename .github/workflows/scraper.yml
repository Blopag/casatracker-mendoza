name: CasaTracker Daily Scrape

on:
  schedule:
    - cron: '0 11 * * *'   # 8am Argentina (UTC-3 = 11 UTC)
  workflow_dispatch:         # Permite correr manualmente desde GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run orchestrator (scraper)
        run: python backend/main_orchestrator.py

      - name: Send Telegram alerts for new properties
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backend/notificador.py

      - name: Commit updated JSON data
        run: |
          git config user.name "casatracker-bot"
          git config user.email "casatracker-bot@users.noreply.github.com"
          git add backend/propiedades_totales.json backend/propiedades_anteriores.json || true
          git diff --staged --quiet || git commit -m "🏡 Datos actualizados $(date +'%Y-%m-%d %H:%M UTC')"
          git push
